name: publish image

# Builds and pushes to GHCR on a tag. GITHUB_TOKEN is enough — no secret is
# stored in this repository, and nothing here needs a credential of the
# owner's.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'CLI version to bake in'
        required: false
        default: '0.1.1'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "cli=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "cli=${{ inputs.cli_version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ETP_VERSION=${{ steps.v.outputs.cli }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/nemet360/easytopaste:${{ steps.v.outputs.cli }}
            ghcr.io/nemet360/easytopaste:latest

      - name: Prove the image runs
        run: |
          docker run --rm ghcr.io/nemet360/easytopaste:${{ steps.v.outputs.cli }} --version
